# PostgreSQL settings
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (JPA) settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
# Sin valor por defecto: si JWT_SECRET no está definido, el arranque falla (fail-closed).
# Generar uno fuerte: openssl rand -base64 32
jwt.secret=${JWT_SECRET}

# Seed admin (creado automaticamente si no existe ninguno)
admin.seed.email=${ADMIN_SEED_EMAIL:admin@admin.com}
admin.seed.password=${ADMIN_SEED_PASSWORD:admin1234}