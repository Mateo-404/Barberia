name: Frontend CI

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'backend-go/api/openapi.json', '.github/workflows/frontend-ci.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'backend-go/api/openapi.json', '.github/workflows/frontend-ci.yml']

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      # Informational: `braces@3.0.3` has no upstream patch and only arrives
      # through the `shadcn` dev CLI (outside the bundle). See
      # docs/migracion-go/04-auditoria-seguridad.md. Does not block CI.
      - run: bun audit || true
